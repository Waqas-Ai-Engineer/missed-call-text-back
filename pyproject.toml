[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "missed-call-text-back"
version = "0.1.0"
description = "Open-source missed call text back planner for service businesses: offline, zero dependencies."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Muhammad Waqas"}]
keywords = ["missed-call-text-back", "sms", "twilio", "lead-response", "small-business", "automation"]

[project.scripts]
mctb = "missed_call_text_back.cli:main"

[tool.setuptools]
packages = ["missed_call_text_back"]
